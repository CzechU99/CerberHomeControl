# Builds a signed release APK for every v* tag (created by `cz bump`) and
# publishes it as a GitHub Release with the matching CHANGELOG.md section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see README, GitHub Actions)."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Create signing config
        working-directory: app/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Test and build APK
        working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build apk --release

      - name: Prepare release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv app/build/app/outputs/flutter-apk/app-release.apk "cerber-$version.apk"

          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## " tag " ") == 1 || $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md 2>/dev/null || true
          if [ ! -s release-notes.md ]; then
            echo "Wydanie $GITHUB_REF_NAME" > release-notes.md
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          name: Cerber ${{ env.VERSION }}
          body_path: release-notes.md
          files: cerber-${{ env.VERSION }}.apk
