name: cerber
description: "Cerber - gate control over MQTT."
publish_to: 'none'
version: 1.2.0+10200

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.4
  mqtt_client: ^10.0.0
  package_info_plus: ^9.0.1
  shared_preferences: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.10.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
