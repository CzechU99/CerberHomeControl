; Copy to ota.local.ini (git-ignored) and set the IP address of each gate.
; Needed when Windows cannot resolve names like cerber-honda.local.
; Tip: reserve the addresses in the router (DHCP reservation by MAC).

[env:honda-ota]
upload_port = 192.168.1.10

[env:hyundai-ota]
upload_port = 192.168.1.11

[env:toyota-ota]
upload_port = 192.168.1.12

[env:main_gate-ota]
upload_port = 192.168.1.13
