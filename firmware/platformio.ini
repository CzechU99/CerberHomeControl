; Cerber gate controllers - one firmware, one environment per gate.
;   pio run                        build all gates
;   pio run -e honda -t upload     flash Honda over USB
;   pio run -e honda-ota -t upload flash Honda over Wi-Fi (ArduinoOTA)

[platformio]
default_envs = honda, hyundai, toyota, main_gate

[env]
platform = platformio/espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@^2.8
extra_scripts = pre:scripts/ota_auth.py

; ===================== GATES (USB) =====================
; DEVICE_ID      - MQTT topics: cerber/<id>/...
; DEVICE_KEY     - selects *_<KEY> credentials in secrets.development.h
; DEVICE_LABEL   - prefix of serial log messages
; OTA_HOSTNAME   - network name used for OTA updates
; Optional per gate: -D RELAY_PIN=..., -D LED_PIN=...

[env:honda]
custom_device_key = HONDA
build_flags =
    -D DEVICE_ID=\"honda\"
    -D DEVICE_KEY=HONDA
    -D DEVICE_LABEL=\"HONDA\"
    -D OTA_HOSTNAME=\"cerber-honda\"

[env:hyundai]
custom_device_key = HYUNDAI
build_flags =
    -D DEVICE_ID=\"hyundai\"
    -D DEVICE_KEY=HYUNDAI
    -D DEVICE_LABEL=\"HYUNDAI\"
    -D OTA_HOSTNAME=\"cerber-hyundai\"

[env:toyota]
custom_device_key = TOYOTA
build_flags =
    -D DEVICE_ID=\"toyota\"
    -D DEVICE_KEY=TOYOTA
    -D DEVICE_LABEL=\"TOYOTA\"
    -D OTA_HOSTNAME=\"cerber-toyota\"

[env:main_gate]
custom_device_key = MAIN_GATE
build_flags =
    -D DEVICE_ID=\"main_gate\"
    -D DEVICE_KEY=MAIN_GATE
    -D DEVICE_LABEL=\"MAIN_GATE\"
    -D OTA_HOSTNAME=\"cerber-main-gate\"

; ===================== GATES (Wi-Fi / OTA) =====================
; The OTA password is read from secrets.development.h by scripts/ota_auth.py.

[env:honda-ota]
extends = env:honda
upload_protocol = espota
upload_port = cerber-honda.local

[env:hyundai-ota]
extends = env:hyundai
upload_protocol = espota
upload_port = cerber-hyundai.local

[env:toyota-ota]
extends = env:toyota
upload_protocol = espota
upload_port = cerber-toyota.local

[env:main_gate-ota]
extends = env:main_gate
upload_protocol = espota
upload_port = cerber-main-gate.local
